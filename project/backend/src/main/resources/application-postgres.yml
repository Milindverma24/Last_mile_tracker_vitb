spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gatiman_db}
    driverClassName: org.postgresql.Driver
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:password123}
    hikari:
      pool-name: GatimanPostgresPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

razorpay:
  key-id: ${RAZORPAY_KEY_ID:rzp_test_gatiman123}
  key-secret: ${RAZORPAY_KEY_SECRET:gatimanSecretKey123}
  currency: INR
  company-name: GATIMAN Logistics Inc.
