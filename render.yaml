services:
  # 1. GATIMAN Backend API (Java Spring Boot)
  - type: web
    name: gatiman-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8088
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_ENABLED
        value: "true"

  # 2. GATIMAN Frontend Web App (React Vite)
  - type: web
    name: gatiman-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: singapore
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://gatiman-backend.onrender.com/api
      - key: VITE_WS_URL
        value: https://gatiman-backend.onrender.com/ws
