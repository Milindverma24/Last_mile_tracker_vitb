version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gatiman_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gatiman_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gatiman_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gatiman_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8088
      DATABASE_URL: jdbc:postgresql://postgres:5432/gatiman_db
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password123
      DATABASE_DRIVER: org.postgresql.Driver
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8088:8088"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gatiman_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  postgres_data:
